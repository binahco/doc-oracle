[project]
name = "llm-doc-oracle"
version = "0.1.0"
description = "doc-oracle: lo que un repo afirma de sí mismo contra su oráculo — afirmaciones medidas, hunks con diff-engine y arreglo validado (semana 24)."
requires-python = ">=3.12"
dependencies = [
    "llm-dev-core",
    "PyYAML>=6,<7",
]

[tool.uv.sources]
llm-dev-core = { path = "../llm-dev-core", editable = true }

[project.scripts]
doc-oracle = "doc_oracle.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/doc_oracle"]

[dependency-groups]
dev = ["pytest>=8,<9"]
